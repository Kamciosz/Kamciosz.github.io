name: Update STEM News

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily, after STEM Discord pipeline (07:00 UTC)
  workflow_dispatch:        # manual run

permissions:
  contents: write

concurrency:
  group: stem-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # No external deps - uses urllib stdlib

      - name: Fetch from Discord
        env:
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
        run: python scripts/fetch_discord.py

      - name: Expand with LLM
        env:
          VSLLM_API_KEY: ${{ secrets.VSLLM_API_KEY }}
        run: python scripts/expand_news.py

      - name: Generate static pages
        run: python scripts/generate_pages.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ news/ index.html rss.xml
          if git diff --cached --quiet; then
            echo "No changes - skipping commit"
          else
            git commit -m "chore: auto-update news $(date -u +%Y-%m-%d)"
            git push
          fi
